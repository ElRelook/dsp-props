[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dsp-props"
dynamic = ["version"]
description = "Property-based testing for digital signal processing code"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Clément Emile Valentin Basdevant" }]
keywords = ["signal processing", "DSP", "property-based testing", "metamorphic testing", "hypothesis", "FFT", "filters"]
dependencies = ["numpy>=1.24", "hypothesis>=6.80"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Hypothesis",
    "Framework :: Pytest",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/clement-basdevant/dsp-props"
Source = "https://github.com/clement-basdevant/dsp-props"
Issues = "https://github.com/clement-basdevant/dsp-props/issues"

[project.scripts]
dsp-props = "dsp_props.cli:main"

[project.optional-dependencies]
# transfer-function checks, IIR error model and the examples use scipy.signal
scipy = ["scipy>=1.11"]
dev = ["pytest>=7", "scipy>=1.11", "build", "twine"]

[tool.hatch.version]
path = "src/dsp_props/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CITATION.cff", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/dsp_props"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
